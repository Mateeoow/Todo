<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f2" />
    <title>Daylight - Daily Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#" id="todayButton" aria-label="Go to today"><span class="brand-mark">D</span><span>daylight</span></a>
        <section class="calendar-panel" aria-label="Calendar">
          <div class="calendar-top"><button class="calendar-arrow" id="previousMonth" aria-label="Previous month">&larr;</button><p id="calendarMonth">July 2026</p><button class="calendar-arrow" id="nextMonth" aria-label="Next month">&rarr;</button></div>
          <div class="calendar-weekdays" aria-hidden="true"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
          <div class="calendar-grid" id="calendarGrid"></div>
        </section>
        <button class="jump-today" id="jumpToday">Today <span>&rarr;</span></button>
        <div class="sidebar-bottom"><div class="day-quote" id="calendarInsight">Choose a day,<br />then give it<br />some intention.</div><div class="profile"><span class="avatar">MG</span><span>My calendar</span><span class="chevron">&#8964;</span></div></div>
      </aside>
      <section class="planner">
        <header class="planner-header"><div><p class="eyebrow" id="todayLabel"></p><h1 id="dayTitle">Plan your <em>day.</em></h1></div><div class="header-actions"><button class="icon-button" id="themeButton" title="Change colour mood" aria-label="Change colour mood">&#9688;</button><button class="add-button" id="addButton"><span>+</span> Add task</button></div></header>
        <section class="moment-card"><div class="sun-wrap"><div class="sun"></div><div class="sun-rays"></div></div><div class="moment-copy"><p class="eyebrow">YOUR NEXT MOMENT</p><h2 id="nextTaskName">A clear day is waiting</h2><p id="nextTaskTime">Add something you want to make time for.</p></div><div class="progress-ring" aria-label="Day progress"><svg viewBox="0 0 44 44"><circle class="ring-base" cx="22" cy="22" r="18"/><circle class="ring-progress" id="ringProgress" cx="22" cy="22" r="18"/></svg><span id="progressText">0%</span></div></section>
        <div class="timeline-heading"><h2 id="flowTitle">Today&apos;s flow</h2><span id="taskSummary">0 tasks &middot; 0 complete</span></div>
        <div class="timeline" id="timeline" aria-live="polite"></div><button class="empty-add" id="emptyAdd"><span>+</span> Add something to this day</button>
      </section>
    </main>
    <dialog class="task-dialog" id="taskDialog"><form method="dialog" id="taskForm"><div class="dialog-heading"><div><p class="eyebrow">SCHEDULE IT</p><h2 id="dialogTitle">Add a task</h2></div><button class="close-button" value="cancel" aria-label="Close">&times;</button></div><label>What needs your attention?<input id="taskTitle" name="title" type="text" placeholder="e.g. Finish project proposal" autocomplete="off" required maxlength="70" /></label><div class="form-row"><label>Date<input id="taskDate" name="date" type="date" required /></label><label>Time<input id="taskTime" name="time" type="time" required /></label></div><label class="energy-field">Energy<select id="taskTone" name="tone"><option value="coral">Focus</option><option value="gold">Light</option><option value="blue">Deep work</option><option value="green">Personal</option></select></label><label class="note-field">A note <span>(optional)</span><input id="taskNote" name="note" type="text" placeholder="A gentle reminder for future you" maxlength="100" /></label><div class="dialog-actions"><button type="button" class="text-button" id="deleteButton">Delete task</button><div><button type="button" class="cancel-button" id="cancelButton">Cancel</button><button class="save-button" value="default">Save task</button></div></div></form></dialog>
    <script src="app.js"></script>
  </body>
</html>
